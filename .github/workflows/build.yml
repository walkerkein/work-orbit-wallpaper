name: build-apk

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk WorkOrbit.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest WorkOrbit.apk \
            --title "Work Orbit 라이브 배경화면 (빌드 ${{ github.run_number }})" \
            --notes "휴대폰에서 WorkOrbit.apk를 내려받아 설치하세요. 설치 후 앱을 열고 '배경화면으로 설정'을 누르면 됩니다."
